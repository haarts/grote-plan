<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23211d">
<title>Grote Plan</title>
<link rel="icon" href="/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header id="top">
  <div class="brand">Grote <span>Plan</span></div>
  <nav id="floors" class="floors"></nav>
  <div class="top-right">
    <span id="live" class="live" title="Live verbonden"></span>
    <form method="post" action="/logout"><button class="ghost small" id="me" title="Uitloggen"></button></form>
  </div>
</header>

<main id="app">
  <section id="mapwrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg">
      <g id="world">
        <image id="plan" preserveAspectRatio="none"/>
        <g id="g-rooms"></g>
        <g id="g-dims"></g>
        <g id="g-links"></g>
        <g id="g-markers"></g>
        <g id="g-draft"></g>
      </g>
    </svg>
    <div id="empty" class="empty hidden"></div>
    <div id="hint" class="hint hidden"></div>

    <div class="maptools tl">
      <div class="seg" id="modes">
        <button data-mode="view" title="Bekijken">Bekijken</button>
        <button data-mode="install" title="Elektra plaatsen">Elektra</button>
        <button data-mode="rooms" title="Ruimtes tekenen en bewerken">Ruimtes</button>
        <button data-mode="scale" title="Schaal instellen">Schaal</button>
        <button data-mode="measure" title="Afstanden meten (wordt niet bewaard)">Meten</button>
      </div>
    </div>
    <div class="maptools tr">
      <button class="icon" id="zoom-in" title="Inzoomen">+</button>
      <button class="icon" id="zoom-out" title="Uitzoomen">−</button>
      <button class="icon" id="zoom-fit" title="Passend maken">⤢</button>
      <button class="icon" id="layers-btn" title="Lagen">☰</button>
      <div id="layers" class="layers hidden">
        <label><input type="checkbox" data-layer="notes" checked> Aantekeningen</label>
        <label><input type="checkbox" data-layer="elec" checked> Elektra</label>
        <label><input type="checkbox" data-layer="rooms" checked> Ruimtes</label>
        <label><input type="checkbox" data-layer="dims"> Alle maten</label>
        <label><input type="checkbox" data-layer="plan" checked> Tekening</label>
      </div>
    </div>
    <div id="palette" class="palette hidden"></div>
    <div id="roombar" class="roombar hidden"></div>
    <div id="popover" class="popover hidden"></div>
    <button id="split" class="split" title="Kaart groter/kleiner">⇕</button>
  </section>

  <section id="panel"></section>
</main>

<div id="ghost" class="ghost hidden"></div>
<dialog id="modal" class="modal" closedby="any" aria-labelledby="modal-title"></dialog>
<dialog id="lightbox" class="lightbox" closedby="any" aria-label="Foto"></dialog>
<div id="toast" class="toast hidden"></div>
<input type="file" id="file-plan" accept="application/pdf,image/*" hidden>
<input type="file" id="file-img" accept="image/*" multiple hidden>
<script src="/app.js"></script>
</body>
</html>
