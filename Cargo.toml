[package]
name = "grote-plan"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.2.4"
anyhow = "1.0.104"
argon2 = "0.5"
axum = { version = "0.8", features = ["multipart", "macros"] }
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
pulldown-cmark = "0.13.6"
rand = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "gzip"] }
rpassword = "7.5.5"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header", "compression-gzip"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 2
